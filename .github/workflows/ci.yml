name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
      - run: npm ci
      - run: npm run build
      - run: npm test

  ci-success:
    runs-on: ubuntu-latest
    needs: [test]
    if: always()
    steps:
      - name: Require test job success
        run: |
          if [ "${{ needs.test.result }}" != "success" ]; then
            echo "Required CI job failed"
            exit 1
          fi
