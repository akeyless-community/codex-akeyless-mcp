# Project-scoped Codex MCP config for Akeyless ARA.
# Copy to .codex/config.toml in your project root (requires trusted project).

[mcp_servers.akeyless-ara]
command = "npx"
args = ["-y", "@akeyless-community/codex-mcp"]
enabled = true
default_tools_approval_mode = "prompt"
startup_timeout_sec = 20
tool_timeout_sec = 120

# Forward credentials from your shell instead of hardcoding:
# env_vars = ["AKEYLESS_ACCESS_ID", "AKEYLESS_ACCESS_KEY", "AKEYLESS_GATEWAY_URL", "AKEYLESS_AGENT_ID"]

[mcp_servers.akeyless-ara.env]
AKEYLESS_ACCESS_ID = "p-xxxxx"
AKEYLESS_ACCESS_KEY = "your-access-key"
AKEYLESS_GATEWAY_URL = "https://your-gateway.example.com:8000"
AKEYLESS_AGENT_ID = "codex-agent"

[mcp_servers.akeyless-ara.tools.query-db]
approval_mode = "prompt"

[mcp_servers.akeyless-ara.tools.service-execute]
approval_mode = "prompt"

[mcp_servers.akeyless-ara.tools.list-secrets]
approval_mode = "auto"

[mcp_servers.akeyless-ara.tools.list-sub-tools]
approval_mode = "auto"
